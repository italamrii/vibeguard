name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run a TypeScript script through tsx (must work on Node 20)
        run: npm run bench -- --files 500
      - name: Smoke test the built CLI
        run: |
          node dist/cli/index.js --version
          node dist/cli/index.js scan --help | grep -q "Scan only code you own"
      - name: Fixture accuracy (fails on any false positive or unexpected miss)
        run: npm run accuracy -- --check
      - name: Self-scan (no secret-shaped literal may enter this repository)
        run: node dist/cli/index.js scan . --config .vibeguard.yml --fail-on low
