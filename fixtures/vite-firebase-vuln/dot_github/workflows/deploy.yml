name: Deploy
on: { push: { branches: [main] } }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # vg-expect: secrets/provider-key
      AWS_ACCESS_KEY_ID: {{FAKE:aws_key_id:deploy}}
      # vg-expect: secrets/provider-key
      AWS_SECRET_ACCESS_KEY: {{FAKE:aws_secret:deploy}}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build && aws s3 sync dist s3://acme-tasks
